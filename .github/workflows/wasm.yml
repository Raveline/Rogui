# Hand-written workflow for the wasm32-wasi cross build (rogui-wasm-backend).
#
# It is deliberately NOT part of .github/workflows/haskell-ci.yml: that file
# is generated by `haskell-ci regenerate` and would clobber any wasm steps
# added to it. The wasm target also needs a whole separate toolchain
# (ghc-wasm-meta) and its own cabal.project.wasm, none of which haskell-ci
# knows about.
#
# Covers: the wasm backend library + both demo executables compile
# (with -Werror), the `rogui` test suite passes when compiled to wasm, and
# the headless-browser end-to-end checks pass.
name: WASM

on:
  push:
  pull_request:
  merge_group:
  workflow_dispatch:

jobs:
  wasm:
    name: wasm build + tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      # Installs wasm32-wasi-ghc / -cabal, wasi-sdk, a bundled Node.js, and
      # the wasm runtime into ~/.ghc-wasm, then appends them to PATH/env for
      # every later step. `master` tracks the latest toolchain; pin the
      # archive URL to a commit sha if a moving target becomes a problem.
      - name: Set up ghc-wasm-meta
        run: |
          cd "$(mktemp -d)"
          curl -f -L --retry 5 \
            https://gitlab.haskell.org/ghc/ghc-wasm-meta/-/archive/master/ghc-wasm-meta-master.tar.gz \
            | tar xz --strip-components=1
          ./setup.sh
          ~/.ghc-wasm/add_to_github_path.sh
        env:
          FLAVOUR: "9.12"

      - name: Cache wasm cabal store
        uses: actions/cache@v4
        with:
          path: ~/.ghc-wasm/.cabal/store
          key: wasm-cabal-${{ hashFiles('cabal.project.wasm', '**/*.cabal') }}
          restore-keys: wasm-cabal-

      - name: Update package index
        run: wasm32-wasi-cabal update

      # Library + rogui-wasm-demo + rogui-wasm-list-demo. -Werror is on
      # (the cabal `devel` flag defaults off), so warnings fail here.
      - name: Build (cabal.project.wasm)
        run: wasm32-wasi-cabal build --project-file=cabal.project.wasm --enable-tests all

      # Runs the rogui tasty suite as a wasm module under the cross runtime
      # (CROSS_EMULATOR is exported by the ghc-wasm-meta env). The native
      # run of the same suite lives in haskell-ci.yml.
      - name: Test suite (wasm)
        run: >
          wasm32-wasi-cabal test --project-file=cabal.project.wasm all
          --test-show-details=direct
          --test-wrapper="$CROSS_EMULATOR"

      # Builds and stages both demos, serves them, and drives them in
      # headless Chrome (preinstalled on ubuntu-latest) via playwright-core.
      - name: Headless browser tests
        run: make test-browser

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Rogui WASM demo</title>
    <style>
      body {
        background: #111;
        color: #ddd;
        font-family: monospace;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.5rem;
      }
      canvas {
        image-rendering: pixelated;
        border: 1px solid #444;
      }
      #rogui-error {
        display: none;
        color: #f77;
        border: 1px solid #f77;
        padding: 0.5rem 1rem;
        white-space: pre-wrap;
        max-width: 40rem;
      }
    </style>
  </head>
  <body>
    <p>Rogui HTML5/WASM backend demo. Requires serving this directory over HTTP (not <code>file://</code>).</p>
    <pre id="rogui-error"></pre>
    <!--
      rogui-wasm-demo.jsffi.js is generated by running the toolchain's
      post-link.mjs over the compiled rogui-wasm-demo.wasm; see
      ../../wasm.md and `make build-wasm-demo` at the repo root.

      There is no WASI implementation in browsers, so this page brings its
      own minimal one (@bjorn3/browser_wasi_shim -- `npm install` in this
      directory before running `make build-wasm-demo`).
    -->
    <script src="rogui-runtime.js"></script>
    <script type="module">
      import { WASI, Fd, ConsoleStdout } from "./node_modules/@bjorn3/browser_wasi_shim/dist/index.js";
      import makeJSFFIImports from "./rogui-wasm-demo.jsffi.js";

      // stdin: reads always return EOF, nothing in this program reads stdin.
      class EmptyStdin extends Fd {
        fd_read() {
          return { ret: 0, data: new Uint8Array(0) };
        }
      }

      const wasi = new WASI(
        [],
        [],
        [
          new EmptyStdin(),
          ConsoleStdout.lineBuffered((line) => console.log(line)),
          ConsoleStdout.lineBuffered((line) => console.error(line)),
        ]
      );

      // Knot-tying per post-link.mjs's own note: `__exports` starts empty,
      // the jsffi import closures capture it by reference, and it's filled
      // in with the real exports once the module is instantiated below.
      const __exports = {};
      const jsffiImports = makeJSFFIImports(__exports);

      const response = await fetch("./rogui-wasm-demo.wasm");
      const { instance } = await WebAssembly.instantiateStreaming(response, {
        wasi_snapshot_preview1: wasi.wasiImport,
        ghc_wasm_jsffi: jsffiImports,
      });
      Object.assign(__exports, instance.exports);

      // WASI "command" style: running _start performs RTS init and runs
      // Haskell's (trivial) `main`. The real setup -- which needs to fetch
      // and decode the tileset image, an async operation -- happens in the
      // `wasmInit` export instead, awaited here; see the note atop
      // app/Main.hs for why that can't live in `main` itself.
      //
      // A failed `wasmInit` (Rogui.Backend.WASM.Run throws, so the awaited
      // Promise rejects) would otherwise be an unhandled rejection with a
      // frozen blank canvas and no on-page hint why; surface it instead.
      try {
        wasi.start(instance);
        await instance.exports.wasmInit();
        globalThis.RoguiRuntime.startLoop(() => instance.exports.wasmTick());
      } catch (e) {
        const box = document.getElementById("rogui-error");
        box.textContent = "Rogui failed to start:\n" + (e && e.stack ? e.stack : e);
        box.style.display = "block";
        throw e;
      }
    </script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Rogui WASM list demo</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        background: #111;
        color: #ddd;
        font-family: monospace;
        display: flex;
        flex-direction: column;
        align-items: stretch;
        box-sizing: border-box;
        gap: 0.5rem;
        padding: 0.5rem;
      }
      p {
        margin: 0;
        flex: none;
      }
      canvas {
        image-rendering: pixelated;
        border: 1px solid #444;
        /* Explicit CSS sizing, independent of the width/height attributes
           (the bitmap resolution) that installListeners' resize handler
           sets to match this box -- see the note in jsbits/rogui-runtime.js. */
        flex: 1;
        min-height: 0;
        width: 100%;
      }
      #rogui-error {
        display: none;
        flex: none;
        color: #f77;
        border: 1px solid #f77;
        padding: 0.5rem 1rem;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <p>
      Rogui HTML5/WASM list demo: click a row or use the up/down arrows. Resize the window to see
      `allowResize` at work. Requires serving this directory over HTTP (not <code>file://</code>).
    </p>
    <pre id="rogui-error"></pre>
    <!--
      rogui-wasm-list-demo.jsffi.js is generated by running the toolchain's
      post-link.mjs over the compiled rogui-wasm-list-demo.wasm; see
      ../../wasm.md and `make build-wasm-list-demo` at the repo root.

      There is no WASI implementation in browsers, so this page brings its
      own minimal one (@bjorn3/browser_wasi_shim -- `npm install` in this
      directory before running that target). Everything below is identical
      to app/index.html except the file names.
    -->
    <script src="rogui-runtime.js"></script>
    <script type="module">
      import { WASI, Fd, ConsoleStdout } from "./node_modules/@bjorn3/browser_wasi_shim/dist/index.js";
      import makeJSFFIImports from "./rogui-wasm-list-demo.jsffi.js";

      class EmptyStdin extends Fd {
        fd_read() {
          return { ret: 0, data: new Uint8Array(0) };
        }
      }

      const wasi = new WASI(
        [],
        [],
        [
          new EmptyStdin(),
          ConsoleStdout.lineBuffered((line) => console.log(line)),
          ConsoleStdout.lineBuffered((line) => console.error(line)),
        ]
      );

      const __exports = {};
      const jsffiImports = makeJSFFIImports(__exports);

      const response = await fetch("./rogui-wasm-list-demo.wasm");
      const { instance } = await WebAssembly.instantiateStreaming(response, {
        wasi_snapshot_preview1: wasi.wasiImport,
        ghc_wasm_jsffi: jsffiImports,
      });
      Object.assign(__exports, instance.exports);

      // A failed `wasmInit` rejects the awaited Promise (Rogui.Backend.WASM.Run
      // throws); show it on the page rather than leaving an unhandled
      // rejection and a blank canvas.
      try {
        wasi.start(instance);
        await instance.exports.wasmInit();
        globalThis.RoguiRuntime.startLoop(() => instance.exports.wasmTick());
      } catch (e) {
        const box = document.getElementById("rogui-error");
        box.textContent = "Rogui failed to start:\n" + (e && e.stack ? e.stack : e);
        box.style.display = "block";
        throw e;
      }
    </script>
  </body>
</html>
